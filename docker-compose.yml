# Runs Hallway next to an existing Switch stack (github.com/switch-ai/switch,
# `docker compose up` there first). Hallway joins Switch's network so Switch
# can call Hallway's privacy guard at http://hallway:8787/guardrails/check.
services:
  hallway:
    build: .
    env_file: .env
    environment:
      SWITCH_URL: http://switch:8000
      MM_URL: http://mattermost:8065
      HALLWAY_GUARD_ENDPOINT: http://hallway:8787
      HALLWAY_DB: /data/hallway.db
    ports:
      - "127.0.0.1:8787:8787"  # put a TLS proxy in front to expose it
    volumes:
      - hallway-data:/data
    networks: [switch]
    restart: unless-stopped

  daypass:
    profiles: [daypass]
    build: ./daypass
    env_file: .env
    environment:
      HALLWAY_URL: http://hallway:8787
    depends_on:
      hallway: {condition: service_healthy}
    networks: [switch]
    restart: unless-stopped

volumes:
  hallway-data:

networks:
  switch:
    name: switch_default
    external: true
