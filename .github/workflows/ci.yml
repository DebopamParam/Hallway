name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Hashed locks (pip-compile, from requirements*.in): anything not pinned
      # and hashed there is refused.
      - name: Install
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app daypass scripts tests
      - name: Tests
        run: python -m pytest

  # ruff (lint + format) and mypy, configured in pyproject.toml; eslint for the
  # SPA through npx (eslint.config.mjs imports nothing, so no node_modules).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: eslint
        run: npx --yes eslint@10.13.0

  # axe-core plus Hallway's own checks (tap targets, focus, sheets, live
  # regions, reduced motion) in headless Chromium, light and dark. The app
  # runs against the in-memory Switch from tests/fakes.py: no Switch stack.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      - name: Accessibility
        run: |
          python scripts/fake_stack.py 8799 > fake_stack.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8799/health > /dev/null && break; sleep 1; done
          python scripts/a11y.py a11y-out http://localhost:8799
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: |
            a11y-out
            fake_stack.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build Hallway image
        run: docker build -t hallway:ci .
      - name: Build day pass worker image
        run: docker build -t hallway-daypass:ci daypass
