name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Hashed locks (pip-compile, from requirements*.in): anything not pinned
      # and hashed there is refused.
      - name: Install
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app daypass scripts tests
      - name: Tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build Hallway image
        run: docker build -t hallway:ci .
      - name: Build day pass worker image
        run: docker build -t hallway-daypass:ci daypass
